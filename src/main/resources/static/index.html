<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Spring AI Chatbot</title>
</head>
<body>
    <h1>Spring AI Chatbot</h1>
    <p>This is a minimal page for quick testing. The REST API is the priority; see the README for curl examples.</p>

    <label for="message">Message:</label>
    <input type="text" id="message" size="60" placeholder="Ask something...">
    <button onclick="sendMessage()">Send</button>

    <pre id="reply"></pre>

    <script>
        async function sendMessage() {
            const message = document.getElementById('message').value;
            const replyEl = document.getElementById('reply');
            replyEl.textContent = 'Loading...';
            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message })
                });
                const data = await response.json();
                replyEl.textContent = response.ok ? data.reply : JSON.stringify(data, null, 2);
            } catch (err) {
                replyEl.textContent = 'Error: ' + err;
            }
        }
    </script>
</body>
</html>
